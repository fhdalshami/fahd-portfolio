<!DOCTYPE html>
<!-- data-bs-theme: الثيم الافتراضي dark. ملف js/theme.js بيغيّره حسب اختيار الزائر (Bootstrap 5.3 بيدعم الوضعين) -->
<html lang="en" data-bs-theme="dark">
<head>
<!-- ترميز الملف UTF-8 -->
<meta charset="utf-8">
<!-- التكيف مع الموبايل. viewport-fit=cover: الصفحة تملا الشاشة حتى حوالين النوتش -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- العنوان الحقيقي بيتحط من الداتا بيز (site_settings.browser_title) -->
<title>Portfolio</title>
<meta name="theme-color" content="#000000">
<!-- Open Graph: معاينة الرابط على واتساب وLinkedIn. لازم تفضل ثابتة في الـ HTML لأن الزحف بيقرا الـ HTML بس (مش بيشغّل الجافاسكريبت).
     بدّل YOUR-USERNAME باسم حسابك أو بالدومين. وعدّل النصوص هنا لو غيّرت اسمك أو وصفك -->
<meta name="description" content="iOS (Swift) and .NET developer building mobile and web applications.">
<meta property="og:type" content="website">
<meta property="og:title" content="Fahd Al-Shami – iOS &amp; .NET Developer">
<meta property="og:description" content="iOS (Swift) and .NET developer building mobile and web applications.">
<meta property="og:url" content="https://YOUR-USERNAME.github.io/fahd-portfolio/">
<meta property="og:image" content="https://YOUR-USERNAME.github.io/fahd-portfolio/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- أيقونة التبويب الافتراضية (بتتغير من الداتا بيز لو favicon_url متحط) -->
<link rel="icon" type="image/png" href="assets/favicon.png">
<!-- الخط -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<!-- تحديد الثيم بدري (قبل ما الصفحة تترسم) عشان ما يحصلش وميض من الأبيض للأسود -->
<script src="js/theme.js?v=2"></script>
<!-- Bootstrap 5.3.3 (نسخة محلية جوه المشروع، مش من إنترنت) ثم تصميمنا فوقه -->
<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<!-- is-loading: المحتوى مخفي لحد ما البيانات توصل من الداتا بيز (data.js بيشيل الكلاس ده) -->
<body class="is-loading">

<!-- كرات ضوء ملونة ثابتة في الخلفية: هي اللي بتخلّي تأثير الزجاج (glass) باين -->
<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

<!-- ===== شريط التنقل: زجاجي وثابت فوق (fixed-top) ومبيختفيش مع السكرول. روابطه بيعملها data.js من جدول sections ===== -->
<nav class="navbar navbar-expand-md fixed-top glass-nav">
  <div class="container">
    <a class="navbar-brand" href="#top" aria-label="Home"><img class="brand-logo" src="assets/logo.png" alt=""></a>
    <!-- أزرار اليمين: تبديل الثيم + زرار القائمة (بيظهر على الموبايل بس) -->
    <div class="nav-actions d-flex align-items-center gap-2 order-md-last">
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle light / dark mode" title="Theme">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn navbar-toggler d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Menu"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
    </div>
    <div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav mx-md-auto" id="navList"></ul></div>
  </div>
</nav>

<main id="top">
  <!-- رسالة تظهر لو الداتا بيز ما اشتغلتش ومفيش نسخة محفوظة -->
  <div class="container text-center text-secondary py-5" id="loadError" hidden>Content couldn’t be loaded. Please refresh the page.</div>

  <!-- ===== البانر الرئيسي (كل نصوصه من site_settings) ===== -->
  <section class="container hero">
    <div class="banner glass">
      <div class="row align-items-end g-4">
        <div class="col-md-7 copy">
          <img class="logo" src="assets/logo.png" alt="">
          <h1 id="heroTitle"></h1>
          <p class="lead" id="heroLead"></p>
          <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-ink rounded-pill" id="cta1" href="#experience" hidden></a>
            <a class="btn btn-ghost rounded-pill" id="cta2" href="#contact" hidden></a>
          </div>
        </div>
        <div class="col-md-5"><div class="peek"><img src="assets/memoji.jpg" alt=""></div></div>
      </div>
    </div>
  </section>

  <!-- ===== الأقسام: كلها مخفية (hidden) لحد ما data.js يظهر اللي موجود في جدول sections ===== -->
  <section id="about" class="container section" hidden>
    <div class="row g-4">
      <div class="col-md-4"><h2></h2></div>
      <div class="col-md-8" id="aboutText"></div>
    </div>
    <!-- شريط المهارات المتحرك (marquee): بيتملي من جدول skills -->
    <div class="marquee mt-5" id="skills" aria-label="Skills" hidden><div class="marquee-track" id="skillsTrack"></div></div>
  </section>

  <section id="projects" class="container section" hidden>
    <h2></h2>
    <div class="stack" id="projectsList"></div>
  </section>

  <section id="experience" class="container section" hidden>
    <h2></h2>
    <div id="experienceList"></div>
  </section>

  <section id="education" class="container section" hidden>
    <div class="row g-4">
      <div class="col-md-4"><h2></h2></div>
      <div class="col-md-8"><ul class="plain" id="educationList"></ul></div>
    </div>
  </section>

  <section id="certifications" class="container section" hidden>
    <div class="row g-4">
      <div class="col-md-4"><h2></h2></div>
      <div class="col-md-8"><ul class="plain" id="certificationsList"></ul></div>
    </div>
  </section>

  <!-- ===== قسم التواصل: عنوانه ونصه من site_settings ===== -->
  <section id="contact" class="container section" hidden>
    <div class="contact glass">
      <h2 id="contactTitle"></h2>
      <p id="contactText"></p>
      <!-- فورم التواصل: يتبعت لـ Formspree (js/contact-form.js). الـ ID بتاعه من site_settings.form_id -->
      <form id="cf" class="cform text-start" novalidate>
        <div class="mb-3"><label class="form-label" for="cfName">Name</label><input id="cfName" class="form-control" name="name" required autocomplete="name"></div>
        <div class="mb-3"><label class="form-label" for="cfEmail">Email</label><input id="cfEmail" class="form-control" type="email" name="email" required autocomplete="email"></div>
        <div class="mb-3"><label class="form-label" for="cfMsg">Message</label><textarea id="cfMsg" class="form-control" name="message" rows="5" required></textarea></div>
        <!-- حقل مخفي ضد السبام (Honeypot) -->
        <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn btn-ink rounded-pill px-4" type="submit">Send message</button>
        <p class="status" role="status" aria-live="polite"></p>
      </form>
      <!-- أيقونات: فتح كارت التعريف، LinkedIn، تحميل الـ CV (الروابط من site_settings) -->
      <div class="links d-flex justify-content-center flex-wrap gap-3">
        <button class="ibtn solid" id="cardToggle" type="button" aria-expanded="false" aria-controls="idwrap" aria-label="Show my card" title="My card"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.4 1.7-2 3-2s2.4.6 3 2"/><path d="M15 10h3M15 13h3"/></svg></button>
        <a class="ibtn" id="linkLinkedIn" href="#" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn" hidden><svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.94 5a2 2 0 1 1-4-.002 2 2 0 0 1 4 .002zM7 8.48H3V21h4V8.48zm6.32 0H9.34V21h3.94v-6.57c0-3.66 4.77-4 4.77 0V21H22v-7.93c0-6.17-7.06-5.94-8.72-2.91l.04-1.68z"/></svg></a>
        <a class="ibtn" id="linkCV" href="#" target="_blank" rel="noopener" aria-label="Download CV" title="Download CV" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg></a>
      </div>
    </div>
  </section>
</main>

<footer class="text-center" id="footer"></footer>

<!-- ===== كارت التعريف (Popup). موضوع هنا برا أي عنصر زجاجي، لأن backdrop-filter بيكسر position:fixed للعناصر اللي جواه ===== -->
<div class="idwrap" id="idwrap" role="dialog" aria-modal="true" aria-label="Contact card">
  <button class="idclose" id="cardClose" type="button" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="idcard" id="idcard">
    <span class="wave" aria-hidden="true">👋</span>
    <div class="idtop">
      <img src="assets/memoji.jpg" alt="">
      <div><h3></h3><p class="role"></p><p class="where"></p></div>
    </div>
    <ul class="idlinks">
      <li id="cardPhoneLi" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><a href="tel:"></a></li>
      <li id="cardMailLi" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><a href="#" data-mail></a></li>
      <li id="cardLocLi" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span></span></li>
    </ul>
  </div>
  <!-- Share: قائمة مشاركة الجهاز (منها Save Image للألبوم). Save: تنزيل PNG -->
  <div class="idactions">
    <button class="ibtn solid" id="cardShare" type="button" aria-label="Share card as image" title="Share"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg></button>
    <button class="ibtn" id="cardSave" type="button" aria-label="Save card as image" title="Save image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg></button>
  </div>
</div>

<!-- رسالة صغيرة تحت الشاشة (toast) -->
<div class="toast-msg" id="toast" role="status" aria-live="polite"></div>

<!-- ===== الجافاسكريبت: Bootstrap أولاً، وبعدين config ثم الباقي. data.js آخر واحد ===== -->
<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="js/config.js?v=2"></script>
<script src="js/email-copy.js?v=2"></script>
<script src="js/contact-form.js?v=2"></script>
<script src="js/typewriter.js?v=2"></script>
<script src="js/card.js?v=2"></script>
<script src="js/data.js?v=2"></script>
</body>
</html>
